name: StudyCI
description: Lint study materials and certification question banks

inputs:
  path:
    description: File or directory to check
    required: true
  version:
    description: StudyCI npm package version
    required: false
    default: "0.1.0"

runs:
  using: composite
  steps:
    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: "20"

    - name: Run StudyCI
      shell: bash
      env:
        STUDYCI_VERSION: ${{ inputs.version }}
        STUDYCI_PATH: ${{ inputs.path }}
      run: npx --yes "studyci@$STUDYCI_VERSION" check "$STUDYCI_PATH"
