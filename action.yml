name: StudyCI
description: Lint study materials and certification question banks

inputs:
  path:
    description: File or directory to check
    required: true
  version:
    description: StudyCI npm package version
    required: false
    default: "0.3.0"

runs:
  using: composite
  steps:
    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: "20"

    - name: Run StudyCI
      shell: bash
      env:
        STUDYCI_VERSION: ${{ inputs.version }}
        STUDYCI_PATH: ${{ inputs.path }}
      run: |
        RESULT_FILE="${RUNNER_TEMP}/studyci-result.json"
        set +e
        npx --yes "studyci@$STUDYCI_VERSION" check "$STUDYCI_PATH" --format json > "$RESULT_FILE"
        STATUS=$?
        set -e

        if [ -s "$RESULT_FILE" ]; then
          cat "$RESULT_FILE"
          node "${{ github.action_path }}/scripts/github-annotations.mjs" "$RESULT_FILE" "$GITHUB_WORKSPACE"
        fi

        exit "$STATUS"
