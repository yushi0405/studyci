name: QUIZR capability validation

on:
  push:
    branches:
      - feat/dialect-capabilities

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout StudyCI
        uses: actions/checkout@v4

      - name: Checkout QUIZR fixture repository
        uses: actions/checkout@v4
        with:
          repository: sipistab/QUIZR
          ref: 597ecf2fe77f81ac803c6208f9e16ad38c4dcacb
          path: external/QUIZR
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - run: npm ci
      - run: npm run build

      - name: Validate QUIZR Exercises
        shell: bash
        run: |
          set +e
          node dist/cli.js check external/QUIZR/Exercises --format json > quizr-exercises.json
          code=$?
          set -e
          test "$code" -eq 1
          node --input-type=module <<'NODE'
          import { readFileSync } from "node:fs";
          const result = JSON.parse(readFileSync("quizr-exercises.json", "utf8"));
          const byCode = {};
          for (const finding of result.findings) byCode[finding.code] = (byCode[finding.code] ?? 0) + 1;
          console.log(JSON.stringify({
            questionCount: result.questionCount,
            fileCount: result.fileCount,
            errors: result.findings.filter((finding) => finding.severity === "error").length,
            warnings: result.findings.filter((finding) => finding.severity === "warning").length,
            findingsByCode: byCode
          }, null, 2));
          if (result.questionCount !== 643) throw new Error(`Expected 643 questions, got ${result.questionCount}`);
          if (result.fileCount !== 32) throw new Error(`Expected 32 files, got ${result.fileCount}`);
          if (result.findings.filter((finding) => finding.severity === "error").length !== 4) throw new Error("Expected four parse errors");
          if (result.findings.filter((finding) => finding.severity === "warning").length !== 0) throw new Error("Expected zero warnings");
          if (byCode["parse-error"] !== 4 || Object.keys(byCode).some((code) => code !== "parse-error")) throw new Error(`Unexpected findings: ${JSON.stringify(byCode)}`);
          NODE

      - name: Validate QUIZR repository root
        shell: bash
        run: |
          set +e
          node dist/cli.js check external/QUIZR --format json > quizr-root.json
          code=$?
          set -e
          test "$code" -eq 1
          node --input-type=module <<'NODE'
          import { readFileSync } from "node:fs";
          const result = JSON.parse(readFileSync("quizr-root.json", "utf8"));
          const byCode = {};
          for (const finding of result.findings) byCode[finding.code] = (byCode[finding.code] ?? 0) + 1;
          if (result.questionCount !== 643 || result.fileCount !== 32) throw new Error("Root scan did not match Exercises scan");
          if (byCode["parse-error"] !== 4 || result.findings.length !== 4) throw new Error(`Unexpected root findings: ${JSON.stringify(byCode)}`);
          NODE
